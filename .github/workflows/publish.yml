name: Publish to npm

on:
  push:
    tags: ["v*"]

# v0.6.1 H7: scoped permissions + concurrency lock.
# v0.6.3 I6.1: OIDC trusted publishing — no long-lived token in CI.
permissions:
  contents: read
  id-token: write  # required for npm OIDC trusted publishing

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # v0.6.3 I6.1: GitHub Environment provides extra protection — required
    # reviewers, branch/tag restrictions, and a clean audit trail of every
    # release. Configure at: Settings → Environments → New environment "npm"
    environment:
      name: npm
      url: https://www.npmjs.com/package/cloakllm

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # v0.6.3 I6.1: npm trusted publishing requires npm CLI ≥ 11.5.1.
          # Node 22 LTS ships with npm 10. We tried `npm install -g npm@latest`
          # to upgrade in-place — that crashes (`Cannot find module
          # 'promise-retry'`) because npm 10's running process loses module
          # resolution mid-overwrite when its own files are replaced with
          # npm 11's incompatible internals. Cleanest fix: pin to Node 24,
          # which ships with npm 11.5+. This affects ONLY the publish job
          # toolchain — the package's own `engines.node: ">=18"` constraint
          # is unchanged, and the tarball produced is identical.
          node-version: 24
          registry-url: https://registry.npmjs.org

      # v0.6.3 I6.1: OIDC trusted publishing replaces the long-lived NPM_TOKEN.
      # Provenance attestations are AUTOMATIC under trusted publishing — no
      # --provenance flag needed (closes the v0.6.2 TODO).
      #
      # Prerequisite (one-time): configure trusted publisher at
      #   https://www.npmjs.com/package/cloakllm/access
      # under "Trusted publishers" with:
      #   Publisher:   GitHub Actions
      #   Org/User:    cloakllm
      #   Repository:  CloakLLM-JS
      #   Workflow:    publish.yml
      #   Environment: npm
      # See: https://docs.npmjs.com/trusted-publishers/
      # After first successful OIDC publish, delete the NPM_TOKEN secret.
      - name: Publish to npm (OIDC + auto-provenance)
        run: npm publish --access public
