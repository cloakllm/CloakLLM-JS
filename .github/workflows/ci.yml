name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# v0.6.1 H7: least-privilege defaults + cancel-on-superseding-push.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: node --test test/*.js

      # v0.6.3 NEW-9: dep CVE audit is now BLOCKING (was continue-on-error).
      # If a CVE without an upstream fix appears, document the exception inline.
      - name: npm audit
        run: npm audit --audit-level=moderate
