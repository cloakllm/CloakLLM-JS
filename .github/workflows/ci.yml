name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# v0.6.1 H7: least-privilege defaults + cancel-on-superseding-push.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: node --test test/*.js

      # v0.6.3 NEW-9: dep CVE audit is now BLOCKING (was continue-on-error).
      # If a CVE without an upstream fix appears, document the exception inline.
      - name: npm audit
        run: npm audit --audit-level=moderate

      # v0.6.5: Pack the package and require it from a fresh dir. Catches
      # broken `files` field, missing dist files, or package.json metadata
      # that would only surface on user installs. Same lesson as the Py +
      # MCP install-tests: `node --test` over local source is not the same
      # as `npm install` of the published tarball.
      - name: Pack + require-smoke from clean dir
        if: matrix.node-version == 22
        run: |
          npm pack
          mkdir -p /tmp/pack-test && cd /tmp/pack-test && npm init -y > /dev/null
          npm install $GITHUB_WORKSPACE/cloakllm-*.tgz
          node -e "
          const { Shield, ShieldConfig } = require('cloakllm');
          const shield = new Shield(new ShieldConfig({ auditEnabled: false }));
          const [sanitized, tm] = shield.sanitize('Email me at john@example.com please');
          if (!sanitized.includes('[EMAIL_0]')) {
            throw new Error('expected [EMAIL_0] in ' + sanitized);
          }
          const restored = shield.desanitize(sanitized, tm);
          if (!restored.includes('john@example.com')) {
            throw new Error('round-trip failed: ' + restored);
          }
          console.log('install-smoke: OK — cloakllm round-trip works from packed tarball');
          "
